name: DesktopBrowser
options:
  bundleIdPrefix: xyz.zongtech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  DesktopBrowser:
    type: application
    platform: iOS
    sources:
      - path: DesktopBrowser
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.zongtech.DesktopBrowser
        PRODUCT_NAME: DesktopBrowser
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 桌面浏览器
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: DesktopBrowser/Info.plist
